<noscript><h1>复旦未来技术研究院</h1><div class="article-body"><figure class="ambient-image__image block h-full w-full object-contain">集合天气预报以多个可能的大气演变描述预测不确定性，其评价同时涉及集合均值误差与成员分布的统计校准。较低的平均误差并不保证集合离散度能够覆盖实际预测误差。FuXi-ENS 针对这一问题，联合学习天气预报与随天气形势变化的随机扰动，以概率目标约束集合输出。<p class="mt-5 text-article-body text-fg-soft md:text-article-body-lg">该模型在初始条件和每个预测步采样扰动，形成具有不同状态演变的集合成员。Science Advances 正式论文报告了相对于历史 ECMWF-ENS 对照的均值误差和概率评分改善，也记录了部分时效下的集合离散度低估。方法与结果应结合分析，以区分计算效率、确定性预测质量和不确定性表达能力。</p><h2 tabindex="-1" class="article-section-heading display mt-12 mb-4 text-subsection-title font-bold text-fg md:text-subsection-title-lg">条件概率预报与集合扰动建模</h2><p class="mt-5 text-article-body text-fg-soft md:text-article-body-lg">大气初始状态存在观测误差，预报模型也包含过程近似；非线性演变使这些误差随时间增长。数值集合预报通过初值和模型扰动生成多个成员，以集合均值估计中心状态，并利用成员差异描述不确定性。扰动的增长取决于当前环流，因此扰动分布需要随天气形势调整。</p><p class="mt-5 text-article-body text-fg-soft md:text-article-body-lg">以逐点 L1 或 L2 误差为主要目标的确定性模型倾向于预测条件中心状态，独立添加任意噪声则缺少对集合分布质量的直接约束。FuXi-ENS 将预报网络与扰动模型联合训练，以概率评分评价成员集合。其随机生成机制采用变分自编码器（VAE）式高斯采样，与迭代去噪的扩散生成过程不同。</p><h2 tabindex="-1" class="article-section-heading display mt-12 mb-4 text-subsection-title font-bold text-fg md:text-subsection-title-lg">气象状态表示与六小时自回归更新</h2><p class="mt-5 text-article-body text-fg-soft md:text-article-body-lg">模型输入为相邻两个时次的大气状态，每时次含 78 个变量：5 类高空变量在 13 个气压层上的取值，加上 13 个地表变量。全球网格为 721×1440，分辨率 0.25°，合并后的输入为 156 通道。两个时次共同表示当前状态与近期变化，模型以六小时步长自回归生成最长十五天预报。</p><p class="mt-5 text-article-body text-fg-soft md:text-article-body-lg">扰动模型 P 采用卷积核和步长均为 8 的二维卷积，将空间网格压缩至 90×180，并整合地理与时间编码。14 个 Swin Transformer 块在 18×18 窗口内处理特征，转置卷积恢复网格并输出高斯分布参数。采样扰动加至输入后，由含 40 个 Transformer 块的预报网络生成下一时次，各集合成员独立采样。</p><figure class="article-figure my-8" data-presentation="paper"><div class="article-figure__media relative overflow-hidden article-figure__paper"><a href="assets/content/images--publications--fuxi-ens-2025-fig6.webp" target="_blank" rel="noopener noreferrer" class="block" aria-label="查看大图：FuXi-ENS 模型架构：预报模型、扰动分布与教师模型"><span class="ambient-image " style="aspect-ratio:750 / 246;height:auto" data-image-state="loading" data-image-immediate="true"><span class="ambient-image__light" aria-hidden="true"></span><span class="ambient-image__reveal"><img src="assets/content/images--publications--fuxi-ens-2025-fig6.webp" alt="FuXi-ENS 模型架构：预报模型、扰动分布与教师模型"  width="750" height="246" loading="lazy" decoding="async" sizes="(min-width: 768px) 680px, (min-width: 760px) 712px, calc(100vw - 48px)"/></figure></span></span></a></div><figcaption class="mt-3 text-metadata text-fg-muted">原论文图 6. FuXi-ENS 的预报网络与扰动模型；虚线框内的未来真值和教师模型 Q 仅用于训练。<span class="mt-1 block"><a href="https://doi.org/10.1126/sciadv.adu2854" target="_blank" rel="noopener noreferrer" class="inline-flex min-h-6 items-center underline decoration-border underline-offset-3">FuXi-ENS 作者（2025）· CC BY-NC 4.0</a></span><a href="assets/content/images--publications--fuxi-ens-2025-fig6.webp" target="_blank" rel="noopener noreferrer" class="mt-1 inline-flex min-h-6 items-center text-accent underline underline-offset-3">查看大图 ↗</a></figcaption></figure><figure class="article-method my-8" data-layout="path"><div class="mb-3 flex justify-end"><button type="button" class="article-method__toggle txt-hl inline-flex items-center gap-2 text-control text-accent" aria-expanded="false" aria-controls="_R_a_-graph" aria-labelledby="_R_a_-caption _R_a_-toggle"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-maximize2" aria-hidden="true"><figure class="ambient-image__image block h-full w-full object-contain"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" x2="14" y1="3" y2="10"></line><line x1="3" x2="10" y1="21" y2="14"></line></svg><span id="_R_a_-toggle">查看全部</span></button></div><div id="_R_a_-graph" class="article-method__viewport" role="region" aria-labelledby="_R_a_-caption"><svg class="article-method__canvas" width="327" height="1100" viewBox="0 0 327 1100" preserveAspectRatio="xMidYMin meet" role="img" aria-labelledby="_R_a_-title _R_a_-description"><title id="_R_a_-title">方法示意. FuXi-ENS 的推理期六小时状态更新。依据原文图 6 与方法部分整理；各集合成员独立采样，训练期教师 Q 不参与此循环。</title><desc id="_R_a_-description">成员输入 相邻两时次气象状态：每时次 78 个变量，合为 156 通道，并提供地理与时间条件。；随机扰动 P：条件扰动分布：根据当前天气形势输出高斯参数，采样扰动并加入输入。；状态预测 预报网络推进六小时：编码器、Transformer 与解码器将扰动后状态映射至下一时次。；自回归回流 移动时间窗口：将预测状态用于下一步输入，再次计算条件扰动并独立采样。；相邻两时次气象状态 → P：条件扰动分布：条件；P：条件扰动分布 → 预报网络推进六小时：扰动后的输入；预报网络推进六小时 → 移动时间窗口：下一时次；移动时间窗口 → 相邻两时次气象状态：继续至所需预报时效</desc><defs><marker id="_R_a_-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="var(--fg-muted)" stroke-width="1.2"></path></marker></defs><path class="article-method__edge" d="M163.5,204 V289" marker-end="url(#_R_a_-arrow)" data-from="state" data-to="perturb" aria-hidden="true"></path><path class="article-method__edge" d="M163.5,480 V565" marker-end="url(#_R_a_-arrow)" data-from="perturb" data-to="forecast" aria-hidden="true"></path><path class="article-method__edge" d="M163.5,756 V841" marker-end="url(#_R_a_-arrow)" data-from="forecast" data-to="shift" aria-hidden="true"></path><path class="article-method__edge" d="M163.5,1032 V1064 H8 V110 H37" marker-end="url(#_R_a_-arrow)" data-from="shift" data-to="state" aria-hidden="true" stroke-dasharray="4 4"></path><foreignObject class="article-method__label-box" x="48" y="216" width="231" height="40" aria-hidden="true"><div class="article-method__label">条件</div></foreignObject><foreignObject class="article-method__label-box" x="48" y="492" width="231" height="40" aria-hidden="true"><div class="article-method__label">扰动后的输入</div></foreignObject><foreignObject class="article-method__label-box" x="48" y="768" width="231" height="40" aria-hidden="true"><div class="article-method__label">下一时次</div></foreignObject><foreignObject class="article-method__label-box" x="48" y="1044" width="231" height="40" aria-hidden="true"><div class="article-method__label">继续至所需预报时效</div></foreignObject><g data-node="state" aria-hidden="true"><rect class="article-method__node" x="40" y="16" width="247" height="188"></rect><foreignObject x="56" y="32" width="215" height="156"><div class="article-method__copy"><div class="mb-2 flex items-center justify-between gap-2 text-metadata text-accent"><span class="min-w-0">成员输入</span><span class="mono shrink-0 whitespace-nowrap">01</span></div><strong class="block text-body-small font-semibold text-fg">相邻两时次气象状态</strong><p class="mt-2 text-body-small text-fg-soft">每时次 78 个变量，合为 156 通道，并提供地理与时间条件。</div></foreignObject></g><g data-node="perturb" aria-hidden="true"><rect class="article-method__node" x="40" y="292" width="247" height="188"></rect><foreignObject x="56" y="308" width="215" height="156"><div class="article-method__copy"><div class="mb-2 flex items-center justify-between gap-2 text-metadata text-accent"><span class="min-w-0">随机扰动</span><span class="mono shrink-0 whitespace-nowrap">02</span></div><strong class="block text-body-small font-semibold text-fg">P：条件扰动分布</strong><p class="mt-2 text-body-small text-fg-soft">根据当前天气形势输出高斯参数，采样扰动并加入输入。</p></div></foreignObject></g><g data-node="forecast" aria-hidden="true"><rect class="article-method__node" x="40" y="568" width="247" height="188"></rect><foreignObject x="56" y="584" width="215" height="156"><div class="article-method__copy"><div class="mb-2 flex items-center justify-between gap-2 text-metadata text-accent"><span class="min-w-0">状态预测</span><span class="mono shrink-0 whitespace-nowrap">03</span></div><strong class="block text-body-small font-semibold text-fg">预报网络推进六小时</strong><p class="mt-2 text-body-small text-fg-soft">编码器、Transformer 与解码器将扰动后状态映射至下一时次。</p></div></foreignObject></g><g data-node="shift" aria-hidden="true"><rect class="article-method__node" x="40" y="844" width="247" height="188"></rect><foreignObject x="56" y="860" width="215" height="156"><div class="article-method__copy"><div class="mb-2 flex items-center justify-between gap-2 text-metadata text-accent"><span class="min-w-0">自回归回流</span><span class="mono shrink-0 whitespace-nowrap">04</span></div><strong class="block text-body-small font-semibold text-fg">移动时间窗口</strong><p class="mt-2 text-body-small text-fg-soft">将预测状态用于下一步输入，再次计算条件扰动并独立采样。</p></div></foreignObject></g></svg></div><figcaption id="_R_a_-caption" class="mt-3 text-metadata text-fg-muted">方法示意. FuXi-ENS 的推理期六小时状态更新。依据原文图 6 与方法部分整理；各集合成员独立采样，训练期教师 Q 不参与此循环。</figcaption></figure><p class="mt-5 text-article-body text-fg-soft md:text-article-body-lg">初始条件及每个预测步均使用 flow-dependent perturbations，即依赖当前天气形势的扰动。随着各成员的预测状态分化，后续扰动的条件分布也随之变化。集合规模由独立采样与运行的成员数量决定，输出变量通道数仍对应气象状态维度。该结构在滚动过程中持续引入随机性，以表征不断发展的预报不确定性。</p><h2 tabindex="-1" class="article-section-heading display mt-12 mb-4 text-subsection-title font-bold text-fg md:text-subsection-title-lg">训练期后验与预报期先验的条件差异</h2><p class="mt-5 text-article-body text-fg-soft md:text-article-body-lg">训练引入教师模型 Q，以当前状态和下一时次真值构造目标高斯分布；扰动模型 P 仅接收预报时可获得的历史状态。训练阶段从 Q 采样，以 KL 项约束 P 与教师分布的差异，同时通过连续分级概率评分（CRPS）评价集合预测。推理阶段移除教师的未来条件，改从 P 生成的分布采样。</p><figure class="my-6"><div class="article-equation flex items-center gap-4 border-y border-border py-5 text-body text-fg"><span class="min-w-0 flex-1"><span dir="ltr" class="article-math article-math--display" tabindex="0">\mathcal{L}=\mathcal{L}_{\mathrm{CRPS}}(\hat{X}^{t+1},X^{t+1})+\lambda\mathcal{L}_{\mathrm{KL}}\!\left(\mathcal{N}(\Theta_p^t),\mathcal{N}(\Theta_q^t)\right)</span></span><span class="mono shrink-0 text-metadata text-fg-muted">(原文 3)</span></div><figcaption class="mt-3 text-metadata text-fg-muted">沿用原文式 3 并省略格点索引。λ = 10⁻⁴；P 为预报期扰动模型，Q 为训练期教师，L_KL 的方向按原文记号保留。</figcaption></figure><p class="mt-5 text-article-body text-fg-soft md:text-article-body-lg">未来真值仅用于训练期教师监督，预报期的信息条件仍由起报时可用状态决定。先验与训练期后验之间的分布差异会影响部署时的采样质量：KL 项约束分布接近程度，CRPS 则评价采样后集合与验证值的关系。两项损失分别作用于潜在扰动分布和最终预测输出。</p><p class="mt-5 text-article-body text-fg-soft md:text-article-body-lg">训练首先在八张 Nvidia A100 上采用纬度加权 L1 损失进行 60,000 次单步预训练，再在 48 张 A100 上联合训练扰动与预报网络。第二阶段将自回归长度由一步逐渐增至三步，每档 3,000 次迭代，每张 GPU 产生一个集合成员。这一课程使训练接触模型自身预测形成的输入；三步训练与十五天滚动之间仍存在时域差异。</p><h2 tabindex="-1" class="article-section-heading display mt-12 mb-4 text-subsection-title font-bold text-fg md:text-subsection-title-lg">集合预报评价指标与数据划分</h2><div class="article-table-wrap my-8 overflow-x-auto" role="region" aria-label="表 1. 集合天气预报的主要评价指标及其解释范围。依据原文 Results 与 Materials and Methods 整理。" tabindex="0"><p class="mb-2 text-metadata text-fg-muted sm:hidden">横向滑动查看完整表格</p><table class="article-table w-full text-start text-body-small text-fg-soft"><caption class="mb-3 text-start text-metadata text-fg-muted">表 1. 集合天气预报的主要评价指标及其解释范围。依据原文 Results 与 Materials and Methods 整理。</caption><thead><tr><th scope="col">指标</th><th scope="col">评价对象</th><th scope="col">解释范围</th></tr></thead><tbody><tr><th scope="row">RMSE</th><td>集合均值与验证值之间的均方根误差，越低越好</td><td>量纲与对应变量一致；不直接评价成员分布校准</td></tr><tr><th scope="row">CRPS</th><td>预测分布与观测之间的连续分级概率评分，越低越好</td><td>量纲与对应变量一致；区别于单条轨迹误差</td></tr><tr><th scope="row">SSR</th><td>集合离散度相对集合均值误差的比值，理想接近 1</td><td>无量纲；小于 1 通常提示欠离散</td></tr><tr><th scope="row">Brier score</th><td>阈值事件预测概率的平方误差，越低越好</td><td>无量纲；比较时需统一变量、阈值与时效</td></tr></tbody></table></div><p class="mt-5 text-article-body text-fg-soft md:text-article-body-lg">CRPS 是评价预测概率分布的适当评分，兼顾预测分布与观测的接近程度及分布集中程度。集合离散度与均值误差之比 SSR 用于检查欠离散或过离散，Brier score 则评价指定阈值事件的预测概率。RMSE、CRPS、SSR 与事件评分分别覆盖中心预测、分布质量、校准和尾部事件，需依据其定义分别解释。</p><p class="mt-5 text-article-body text-fg-soft md:text-article-body-lg">训练数据覆盖 2002–2016 年，2017 年用于验证，2018 年用于测试。FuXi-ENS 使用 48 个成员，对照为 2018 年 ECMWF-ENS 的 51 成员历史预报，统一在 0.25° 网格评价。比较对象因此是该历史业务系统版本，测试范围为一个独立年份。原文对若干指标进行重采样显著性检验，跨年份和不同气候状态的适用性仍需另外评价。</p><h2 tabindex="-1" class="article-section-heading display mt-12 mb-4 text-subsection-title font-bold text-fg md:text-subsection-title-lg">平均误差改善与离散度不足</h2><p class="mt-5 text-article-body text-fg-soft md:text-article-body-lg">图 1 中，近地面气温 T2M 的集合均值 RMSE 相对改善在约第二天达到 25%。该数值对应特定变量与时效。图 2 的 CRPS 在前七天多数变量上相对改善约 10%–30%，例外包括 Z500 最初两天及 T850 最初十二小时；随预报时效增长，整体优势收窄。百分比表示相对于对照的误差降幅，不是准确率的百分点变化。</p><figure class="article-figure my-8" data-presentation="paper"><div class="article-figure__media relative overflow-hidden article-figure__paper"><a href="assets/content/images--publications--fuxi-ens-2025-fig1.webp" target="_blank" rel="noopener noreferrer" class="block" aria-label="查看大图：FuXi-ENS 与 ECMWF-ENS 的集合均值误差和相关评分随预报时效变化"><span class="ambient-image " style="aspect-ratio:787 / 580;height:auto" data-image-state="loading" data-image-immediate="true"><span class="ambient-image__light" aria-hidden="true"></span><span class="ambient-image__reveal"><img src="assets/content/images--publications--fuxi-ens-2025-fig1.webp" alt="FuXi-ENS 与 ECMWF-ENS 的集合均值误差和相关评分随预报时效变化"  width="787" height="580" loading="lazy" decoding="async" sizes="(min-width: 768px) 680px, (min-width: 760px) 712px, calc(100vw - 48px)"/></figure></span></span></a></div><figcaption class="mt-3 text-metadata text-fg-muted">原论文图 1. 集合均值的 RMSE、ACC 与 MBE 对照；颜色和符号定义沿用原图。<span class="mt-1 block"><a href="https://doi.org/10.1126/sciadv.adu2854" target="_blank" rel="noopener noreferrer" class="inline-flex min-h-6 items-center underline decoration-border underline-offset-3">FuXi-ENS 作者（2025）· CC BY-NC 4.0</a></span><a href="assets/content/images--publications--fuxi-ens-2025-fig1.webp" target="_blank" rel="noopener noreferrer" class="mt-1 inline-flex min-h-6 items-center text-accent underline underline-offset-3">查看大图 ↗</a></figcaption></figure><figure class="ambient-image__image block h-full w-full object-contain">图 2 显示，第二天左右 FuXi-ENS 的集合离散度低估约 20%–30%，表明成员分布对剩余误差的表达不足。原文提出两项可能机制：短时效下 CRPS 的行为接近 L1，以及初始扰动对快速增长模态的投影有限。这些解释与观测结果相容，但未通过独立消融排除其他原因。<figure class="article-figure my-8" data-presentation="paper"><div class="article-figure__media relative overflow-hidden article-figure__paper"><a href="assets/content/images--publications--fuxi-ens-2025-fig2.webp" target="_blank" rel="noopener noreferrer" class="block" aria-label="查看大图：集合概率评分及离散度误差比的多变量比较"><span class="ambient-image " style="aspect-ratio:787 / 741;height:auto" data-image-state="loading" data-image-immediate="true"><span class="ambient-image__light" aria-hidden="true"></span><span class="ambient-image__reveal"><img src="assets/content/images--publications--fuxi-ens-2025-fig2.webp" alt="集合概率评分及离散度误差比的多变量比较"  width="787" height="741" loading="lazy" decoding="async" sizes="(min-width: 768px) 680px, (min-width: 760px) 712px, calc(100vw - 48px)"/></figure></span></span></a></div><figcaption class="mt-3 text-metadata text-fg-muted">原论文图 2. CRPS、ROCASS 与离散度—误差比 SSR 的时效对照；均值误差与概率校准须分别解读。<span class="mt-1 block"><a href="https://doi.org/10.1126/sciadv.adu2854" target="_blank" rel="noopener noreferrer" class="inline-flex min-h-6 items-center underline decoration-border underline-offset-3">FuXi-ENS 作者（2025）· CC BY-NC 4.0</a></span><a href="assets/content/images--publications--fuxi-ens-2025-fig2.webp" target="_blank" rel="noopener noreferrer" class="mt-1 inline-flex min-h-6 items-center text-accent underline underline-offset-3">查看大图 ↗</a></figcaption></figure><aside class="my-6 border-s-3 border-border-strong bg-surface-2 p-5"><h3 class="text-body-small font-semibold text-accent">集合离散度与均值误差的区别</h3><figure class="ambient-image__image block h-full w-full object-contain">集合成员之间的差异表示模型产生的预测分散程度，集合均值与验证值之间的误差则反映中心预测偏差。两者在统计上需要匹配：成员高度集中且均值误差较小时，仍可能遗漏低频但偏差较大的情况。因此，均值误差下降与校准改善需要分别验证。</aside><p class="mt-5 text-article-body text-fg-soft md:text-article-body-lg">补充图 S24 的损失替代对照显示，以 L1 取代 CRPS 后，CRPS、RMSE、集合离散度和 SSR 的结果均变差，为概率训练目标的作用提供了证据。完整模型仍存在欠离散，说明在有限数据、模型和集合规模下，适当评分的优化尚未消除校准误差。面向风险应用时还需按地点、季节和事件阈值评价可靠性。</p><figure class="article-figure my-8" data-presentation="paper"><div class="article-figure__media relative overflow-hidden article-figure__paper"><a href="assets/content/images--publications--fuxi-ens-2025-fig-s24.webp" target="_blank" rel="noopener noreferrer" class="block" aria-label="查看大图：四个气象变量上 CRPS 与 L1 训练目标的概率评分、均值误差、离散度及 SSR 对照"><span class="ambient-image " style="aspect-ratio:2048 / 1506;height:auto" data-image-state="loading" data-image-immediate="true"><span class="ambient-image__light" aria-hidden="true"></span><span class="ambient-image__reveal"><img src="assets/content/images--publications--fuxi-ens-2025-fig-s24.webp" alt="四个气象变量上 CRPS 与 L1 训练目标的概率评分、均值误差、离散度及 SSR 对照"  width="2048" height="1506" loading="lazy" decoding="async" sizes="(min-width: 768px) 680px, (min-width: 760px) 712px, calc(100vw - 48px)"/></figure></span></span></a></div><figcaption class="mt-3 text-metadata text-fg-muted">原论文补充图 S24. CRPS + KL（红）与 L1 + KL（黑）的损失替代对照；各列依次为 CRPS、RMSE、SPREAD 与 SSR。离散度大小须结合误差和 SSR 解读。<span class="mt-1 block"><a href="https://doi.org/10.1126/sciadv.adu2854" target="_blank" rel="noopener noreferrer" class="inline-flex min-h-6 items-center underline decoration-border underline-offset-3">FuXi-ENS 作者（2025）· CC BY-NC 4.0</a></span><a href="assets/content/images--publications--fuxi-ens-2025-fig-s24.webp" target="_blank" rel="noopener noreferrer" class="mt-1 inline-flex min-h-6 items-center text-accent underline underline-offset-3">查看大图 ↗</a></figcaption></figure><h2 tabindex="-1" class="article-section-heading display mt-12 mb-4 text-subsection-title font-bold text-fg md:text-subsection-title-lg">热带气旋路径误差与集合覆盖</h2><figure class="ambient-image__image block h-full w-full object-contain">热带气旋评价以国际最佳路径档案 IBTrACS 为参考。相对于对照，集合均值路径误差在早期降低约 10%，第五天降低约 20%；第三天之后的不确定性仍低估约 20%–30%。路径中心位置的改善与路径分布覆盖不足同时存在，二者对应不同预报能力。<p class="mt-5 text-article-body text-fg-soft md:text-article-body-lg">纳入分析的预报要求至少三分之二集合成员检出气旋；FuXi-ENS 与 ECMWF-ENS 最终分别包含 167 和 165 例，覆盖原文所述 2018 年测试资料的约 20%。两套系统的纳入数量不同，检出不足的情形也未进入该路径比较，因此结果主要反映满足检出条件后的路径性能，不覆盖全部气旋生成、消亡与漏报。</p><h2 tabindex="-1" class="article-section-heading display mt-12 mb-4 text-subsection-title font-bold text-fg md:text-subsection-title-lg">热浪案例与极端事件的统计证据</h2><p class="mt-5 text-article-body text-fg-soft md:text-article-body-lg">2018 年东北亚热浪案例使用提前五天起报、有效时刻为 7 月 23 日 06 UTC 的 T2M。图 5 所绘陆地区域内，FuXi-ENS 的集合均值 RMSE 为 2.36 K，对照为 2.76 K。论文结合副热带高压与黄海异常气旋结构分析温度误差差异；该结果属于特定区域和时次的案例证据，广泛热浪技能仍需多事件评价。</p><figure class="article-figure my-8" data-presentation="paper"><div class="article-figure__media relative overflow-hidden article-figure__paper"><a href="assets/content/images--publications--fuxi-ens-2025-fig5.webp" target="_blank" rel="noopener noreferrer" class="block" aria-label="查看大图：东北亚热浪案例中两个集合系统的温度预测及离散度地图"><span class="ambient-image " style="aspect-ratio:787 / 566;height:auto" data-image-state="loading" data-image-immediate="true"><span class="ambient-image__light" aria-hidden="true"></span><span class="ambient-image__reveal"><img src="assets/content/images--publications--fuxi-ens-2025-fig5.webp" alt="东北亚热浪案例中两个集合系统的温度预测及离散度地图"  width="787" height="566" loading="lazy" decoding="async" sizes="(min-width: 768px) 680px, (min-width: 760px) 712px, calc(100vw - 48px)"/></figure></span></span></a></div><figcaption class="mt-3 text-metadata text-fg-muted">原论文图 5. 2018 年东北亚热浪的五天预报：真值、最佳成员、集合均值及离散度对照。<span class="mt-1 block"><a href="https://doi.org/10.1126/sciadv.adu2854" target="_blank" rel="noopener noreferrer" class="inline-flex min-h-6 items-center underline decoration-border underline-offset-3">FuXi-ENS 作者（2025）· CC BY-NC 4.0</a></span><a href="assets/content/images--publications--fuxi-ens-2025-fig5.webp" target="_blank" rel="noopener noreferrer" class="mt-1 inline-flex min-h-6 items-center text-accent underline underline-offset-3">查看大图 ↗</a></figcaption></figure><p class="mt-5 text-article-body text-fg-soft md:text-article-body-lg">案例同时比较最佳成员、集合均值和离散度。最佳成员按事后与真值的接近程度确定，可用于判断集合是否包含合理演变，但起报时无法预知其索引。业务预报的可交付信息主要来自完整集合及相应概率产品，因此事后最优成员与集合系统的实际可用性能应分别报告。</p><p class="mt-5 text-article-body text-fg-soft md:text-article-body-lg">极端事件阈值根据 1993–2016 年气候分布按格点、月份和时次建立，并以 Brier score 评价高、低百分位事件。文中 2160 个 cases 由 6 个百分位、6 个变量和 60 个预报时效相乘得到，统计单位是评价组合，并非 2160 次独立天气事件。结果显示较短时效下的优势更明显，具体数值仍依赖变量、阈值和空间平均方式。</p><h2 tabindex="-1" class="article-section-heading display mt-12 mb-4 text-subsection-title font-bold text-fg md:text-subsection-title-lg">单成员推理成本与集合规模</h2><p class="mt-5 text-article-body text-fg-soft md:text-article-body-lg">论文报告，单张 Nvidia A100 生成一个成员的十五天预报约需十秒。完整 48 成员集合的总时间取决于串行或多 GPU 并行执行，训练所用的 48 张 A100 属于另一个成本阶段。端到端业务延迟还包括初值准备、数据传输和产品后处理，因此单成员网络推理时间与完整预报服务耗时应分别计量。</p><p class="mt-5 text-article-body text-fg-soft md:text-article-body-lg">FuXi-ENS 将天气状态预测与扰动分布纳入联合训练，通过逐步采样连接模型结构、概率目标和集合评价。所报告实验支持其在 2018 年对照条件下的预测与计算效率优势，同时揭示了集合离散度不足。后续评价需扩大独立年份与事件覆盖，并进一步检验概率校准和不同天气形势下的物理一致性。</p></div><p>完整交互版本需要启用 JavaScript。</p></noscript>
