<noscript><h1>复旦未来技术研究院</h1><div class="article-body"><figure class="ambient-image__image block h-full w-full object-cover">复杂科学问题通常同时包含知识检索、条件约束和多步计算。语言模型能够生成形式上连贯的推理过程，但步骤连贯并不保证结论成立。FIFT-R1 的研究问题是：将候选生成、独立验证与局部修正组织为可重复的训练循环后，模型是否能够在固定推理预算下减少可定位的错误。本文以方法框架与评价协议为主，不将设计目标写成未经验证的性能结果。<p class="mt-5 text-article-body text-fg-soft md:text-article-body-lg">分析需要区分三个层次：最终答案是否正确，中间步骤是否获得证据支持，修正是否由有效反馈引起。只观察最终答案，会掩盖错误步骤偶然得到正确结论的情况；只观察解释文本，也无法判断它是否对应真实求解过程。因此，研究同时记录候选轨迹、验证结果与修改位置，并将三者作为独立评价对象。</p><h2 tabindex="-1" class="article-section-heading display mt-12 mb-4 text-subsection-title font-bold text-fg md:text-subsection-title-lg">1. 问题定义与可验证任务</h2><p class="mt-5 text-article-body text-fg-soft md:text-article-body-lg">设输入问题为 x，推理轨迹为 z，最终答案为 y。生成器根据问题和可用证据产生候选，验证器检查答案或中间状态，修正器据此更新轨迹。不同领域允许的验证方式不同：代码可执行测试，数学可比较标准答案或形式约束，科学问答则可能需要文献、量纲和数据的一致性检查。</p><figure class="my-6"><div class="article-equation flex items-center gap-4 border-y border-border py-5 text-body text-fg"><span class="min-w-0 flex-1"><span dir="ltr" class="article-math article-math--display" tabindex="0">(z,y)\sim\pi_\theta(\cdot\mid x,E);\quad v=V(x,z,y,E)</span></span><span class="mono shrink-0 text-metadata text-fg-muted">(1)</span></div><figcaption class="mt-3 text-metadata text-fg-muted"><span dir="ltr" class="article-math">E</span> 为问题允许使用的证据集合；<span dir="ltr" class="article-math">V</span> 返回验证结果及可定位的错误信息。证据访问范围在实验前固定。</figcaption></figure><ul class="article-list mt-4 space-y-3 ps-6 text-article-body text-fg-soft md:text-article-body-lg list-disc"><li><strong class="font-semibold text-fg">答案约束：</strong> 明确输出类型、数值容差、单位与允许的等价表达。</li><li><strong class="font-semibold text-fg">过程约束：</strong> 记录关键假设、工具调用和状态变化，区分解释文本与可执行证据。</li><li><strong class="font-semibold text-fg">证据约束：</strong> 保存来源、时间与版本；测试题的参考答案不参与候选生成。</li><li><strong class="font-semibold text-fg">预算约束：</strong> 固定生成 token、验证调用和工具运行时间，避免把额外计算误认为方法收益。</li></ul><p class="mt-5 text-article-body text-fg-soft md:text-article-body-lg">任务划分以问题来源与解题模板为单位。相同模板的参数变体跨训练和测试集合出现时，模型可能依靠记忆完成任务。科学问答还需检查参考文献与训练材料的重叠；若无法完全排除，应单独报告已知资料范围内的结果，并以新的数据或组合条件检验迁移。</p><h2 tabindex="-1" class="article-section-heading display mt-12 mb-4 text-subsection-title font-bold text-fg md:text-subsection-title-lg">2. 候选生成与反馈表示</h2><h3 tabindex="-1" class="article-section-heading display mt-8 mb-3 text-card-title-lg font-semibold text-fg">2.1 独立候选与局部修正</h3><p class="mt-5 text-article-body text-fg-soft md:text-article-body-lg">独立采样提供不同求解路径，局部修正则利用已有计算中的正确部分。两者的计算成本不同，应在相同总预算下比较。修正过程保留原始轨迹、错误定位与修改片段；只保存最后一次输出，会丢失解释改进来源的重要信息，也难以识别无效的重复尝试。</p><p class="mt-5 text-article-body text-fg-soft md:text-article-body-lg"><a href="https://arxiv.org/abs/2303.17651" target="_blank" rel="noopener noreferrer" class="txt-hl text-accent underline underline-offset-3">Self-Refine</a> 讨论了基于自反馈的迭代改进，可作为生成—反馈—修订结构的公开参考。自反馈与独立验证仍需区分：前者可能复用生成器的偏差，后者通过独立规则、测试或证据提供额外约束。本文协议将这两种反馈分别作为实验条件。</p><h3 tabindex="-1" class="article-section-heading display mt-8 mb-3 text-card-title-lg font-semibold text-fg">2.2 可定位的验证信息</h3><p class="mt-5 text-article-body text-fg-soft md:text-article-body-lg">反馈不仅包含通过或失败，还应说明失败发生在哪个约束。例如，代码测试失败可返回输入、预期行为与异常位置；量纲检查可指出单位组合不一致；证据检查可标记结论没有被所给材料支持。反馈粒度影响修正难度，因此比较时需要固定反馈格式，不能同时更换验证器与推理策略。</p><div class="article-table-wrap my-8 overflow-x-auto" role="region" aria-label="表 1｜不同任务的验证方式与误差来源" tabindex="0"><p class="mb-2 text-metadata text-fg-muted sm:hidden">横向滑动查看完整表格</p><table class="article-table w-full text-start text-body-small text-fg-soft"><caption class="mb-3 text-start text-metadata text-fg-muted">表 1｜不同任务的验证方式与误差来源</caption><thead><tr><th scope="col">任务</th><th scope="col">验证依据</th><th scope="col">需要单独分析的偏差</th></tr></thead><tbody><tr><th scope="row">数学求解</th><td>答案容差、形式关系、步骤约束</td><td>等价表达与中间步骤漏检</td></tr><tr><th scope="row">代码生成</th><td>独立测试、执行结果与资源限制</td><td>测试覆盖不足与环境差异</td></tr><tr><th scope="row">科学问答</th><td>可追踪证据、单位与数据一致性</td><td>来源缺失、版本变化与证据外推</td></tr><tr><th scope="row">组合任务</th><td>多个验证条件的联合满足</td><td>局部通过与整体目标之间的差异</td></tr></tbody></table></div><figure class="article-figure my-8"><div class="article-figure__media relative overflow-hidden rounded-card bg-surface-2"><span class="ambient-image " style="--ambient-a:#bec2c5;--ambient-b:#a8acae" data-image-state="loading" data-image-immediate="true"><span class="ambient-image__light" aria-hidden="true"></span><span class="ambient-image__reveal"><img src="assets/content/src--content--mock--images--network.jpg" alt="图 1｜计算网络概念配图。候选、验证与修正作为独立模块保存记录，便于追踪反馈来源。"  width="1400" height="933" loading="lazy" decoding="async" srcSet="assets/content/src--content--mock--images--thumbs--network.jpg 320w, assets/content/src--content--mock--images--network.jpg 1400w" sizes="(min-width: 768px) 680px, (min-width: 760px) 712px, calc(100vw - 48px)"/></figure></span></span></div><figcaption class="mt-3 text-metadata text-fg-muted">图 1｜计算网络概念配图。候选、验证与修正作为独立模块保存记录，便于追踪反馈来源。</figcaption></figure><h2 tabindex="-1" class="article-section-heading display mt-12 mb-4 text-subsection-title font-bold text-fg md:text-subsection-title-lg">3. 训练目标与验证器依赖</h2><figure class="ambient-image__image block h-full w-full object-cover">验证信号可用于候选筛选，也可进入策略优化。两种用途需要分别报告：筛选改变推理时的计算过程，训练改变模型参数。如果只展示组合后的结果，就无法判断性能变化来自更多候选、较强验证器，还是参数更新。训练阶段还需要限制策略对验证规则的过拟合。<figure class="my-6"><div class="article-equation flex items-center gap-4 border-y border-border py-5 text-body text-fg"><span class="min-w-0 flex-1"><span dir="ltr" class="article-math article-math--display" tabindex="0">J(\theta)=\mathbb{E}_{\pi_\theta}[R(x,z,y)]-\beta D_{\mathrm{KL}}(\pi_\theta\Vert\pi_{\mathrm{ref}})</span></span><span class="mono shrink-0 text-metadata text-fg-muted">(2)</span></div><figcaption class="mt-3 text-metadata text-fg-muted">示意性的带参考策略约束目标。<span dir="ltr" class="article-math">R</span> 为预先定义的验证奖励，<span dir="ltr" class="article-math">\beta</span> 控制偏离参考策略的程度；不表示某个已发布模型的完整训练实现。</figcaption></figure><p class="mt-5 text-article-body text-fg-soft md:text-article-body-lg"><a href="https://arxiv.org/abs/2501.12948" target="_blank" rel="noopener noreferrer" class="txt-hl text-accent underline underline-offset-3">DeepSeek-R1</a> 提供了强化学习激励推理能力的公开研究路线。本文借此区分奖励可验证的任务与主要依赖主观判断的任务，不将某一领域的验证成功直接外推到所有科学问题。奖励函数的覆盖范围、可被投机利用的规则和未覆盖错误均应进入实验记录。</p><aside class="my-6 border-s-3 border-border-strong bg-surface-2 p-5"><h3 class="text-body-small font-semibold text-accent">方法注释｜验证器不等于真值</h3><p class="mt-2 text-body-small text-fg-soft">验证器通过只能说明所定义约束被满足。对未覆盖条件、过弱测试或错误证据，仍需独立评价。训练使用的验证器与最终测试依据应尽可能分离。</p></aside><h2 tabindex="-1" class="article-section-heading display mt-12 mb-4 text-subsection-title font-bold text-fg md:text-subsection-title-lg">4. 过程监督与数据组织</h2><p class="mt-5 text-article-body text-fg-soft md:text-article-body-lg">最终结果监督具有较低标注成本，但较难定位早期错误。过程监督可以对中间步骤给出反馈，却需要定义步骤边界与正确性标准。<a href="https://arxiv.org/abs/2305.20050" target="_blank" rel="noopener noreferrer" class="txt-hl text-accent underline underline-offset-3">Let&#x27;s Verify Step by Step</a> 是过程监督的公开参考。将过程标签用于新领域时，需要检查标签一致性，避免把标注者的表达偏好误当作推理正确性。</p><p class="mt-5 text-article-body text-fg-soft md:text-article-body-lg">训练记录按 <code class="article-inline-code">problem_id</code>、<code class="article-inline-code">trajectory_id</code> 和 <code class="article-inline-code">verifier_version</code> 关联。每次修正保留父轨迹与反馈来源；工具结果保存运行环境、输入和输出摘要。相同问题产生的大量候选具有相关性，采样时应控制问题权重，避免候选数最多的问题主导优化。</p><ol class="article-list mt-4 space-y-3 ps-6 text-article-body text-fg-soft md:text-article-body-lg list-decimal"><li>冻结问题、证据和验证协议，建立按来源分组的数据划分。</li><li>生成候选轨迹，保存执行结果与验证器的版本化反馈。</li><li>对有效修正、无效修正和奖励投机分别标记，不只保留成功样本。</li><li>在独立任务上评价更新后的策略，并保留与更新前模型的预算一致比较。</li></ol><h2 tabindex="-1" class="article-section-heading display mt-12 mb-4 text-subsection-title font-bold text-fg md:text-subsection-title-lg">5. 预算一致的评价协议</h2><p class="mt-5 text-article-body text-fg-soft md:text-article-body-lg">推理方法经常使用不同数量的候选和验证调用。对比时同时给出固定预算结果与随预算变化的曲线，才可以区分效率与最终性能。对于代码任务，工具执行耗时也计入总预算；对于科学问答，外部检索范围与证据长度需要一致。总 token 相同但验证条件不同，仍不构成严格等价的比较。</p><div class="article-table-wrap my-8 overflow-x-auto" role="region" aria-label="表 2｜推理与修正的评价指标" tabindex="0"><p class="mb-2 text-metadata text-fg-muted sm:hidden">横向滑动查看完整表格</p><table class="article-table w-full text-start text-body-small text-fg-soft"><caption class="mb-3 text-start text-metadata text-fg-muted">表 2｜推理与修正的评价指标</caption><thead><tr><th scope="col">指标</th><th scope="col">统计口径</th><th scope="col">解释目的</th></tr></thead><tbody><tr><th scope="row">首轮正确率</th><td>无修正条件下的独立问题结果</td><td>模型原始求解能力</td></tr><tr><th scope="row">预算内正确率</th><td>冻结计算预算后的最终结果</td><td>方法与计算资源共同作用</td></tr><tr><th scope="row">有效修正率</th><td>由错误转为正确的修正 / 全部修正</td><td>反馈是否产生实际纠错</td></tr><tr><th scope="row">误改率</th><td>由正确转为错误的修正 / 原正确候选</td><td>修正过程的副作用</td></tr><tr><th scope="row">验证误差</th><td>验证判断与独立真值的差异</td><td>验证器的覆盖与可靠性</td></tr></tbody></table></div><p class="mt-5 text-article-body text-fg-soft md:text-article-body-lg">置信区间以独立问题或任务家族为单位估计，不能把同一问题的多个候选当作独立样本。对复杂度分层后分别报告，可以检查方法是否只改善较容易验证的题目。平均正确率之外，还应分析错误发生的位置、反馈类型和修改次数，以判断修正机制是否解决了主要瓶颈。</p><h2 tabindex="-1" class="article-section-heading display mt-12 mb-4 text-subsection-title font-bold text-fg md:text-subsection-title-lg">6. 消融设计与失效类型</h2><p class="mt-5 text-article-body text-fg-soft md:text-article-body-lg">消融实验固定模型、候选预算和测试问题，分别改变反馈来源、错误定位和参数更新。独立采样加筛选是必要基线：如果迭代修正只是在同样成本下产生更多候选，收益应与该基线比较。去除定位信息的实验，则检验结构化反馈是否比简单的失败标记提供额外价值。</p><ul class="article-list mt-4 space-y-3 ps-6 text-article-body text-fg-soft md:text-article-body-lg list-disc"><li><strong class="font-semibold text-fg">自反馈与外部验证：</strong> 区分语言模型自身判断与独立工具或规则的作用。</li><li><strong class="font-semibold text-fg">整体重写与局部修正：</strong> 比较正确步骤保留程度、误改率及计算开销。</li><li><strong class="font-semibold text-fg">冻结参数与更新参数：</strong> 区分推理时筛选与训练时学习的收益。</li><li><strong class="font-semibold text-fg">已见与未见验证器：</strong> 检查对特定奖励规则的过拟合与迁移。</li></ul><p class="mt-5 text-article-body text-fg-soft md:text-article-body-lg">失效分析至少覆盖证据误用、约束遗漏、循环修正与验证投机。一个模型可能重复生成符合评分格式却缺少实质依据的回答，也可能在局部测试通过后忽略整体目标。对这些案例保留完整轨迹，比增加一段自动解释更有助于确定下一步需要改进的模块。</p><figure class="article-figure my-8"><div class="article-figure__media relative overflow-hidden rounded-card bg-surface-2"><span class="ambient-image " style="--ambient-a:#525251;--ambient-b:#535350" data-image-state="loading" data-image-immediate="true"><span class="ambient-image__light" aria-hidden="true"></span><span class="ambient-image__reveal"><img src="assets/content/src--content--mock--images--datacenter.jpg" alt="图 2｜计算设施配图。模型、验证器、数据与工具环境的版本共同决定复现实验条件。"  width="1400" height="786" loading="lazy" decoding="async" srcSet="assets/content/src--content--mock--images--thumbs--datacenter.jpg 320w, assets/content/src--content--mock--images--datacenter.jpg 1400w" sizes="(min-width: 768px) 680px, (min-width: 760px) 712px, calc(100vw - 48px)"/></figure></span></span></div><figcaption class="mt-3 text-metadata text-fg-muted">图 2｜计算设施配图。模型、验证器、数据与工具环境的版本共同决定复现实验条件。</figcaption></figure><h2 tabindex="-1" class="article-section-heading display mt-12 mb-4 text-subsection-title font-bold text-fg md:text-subsection-title-lg">7. 复现条件与研究局限</h2><p class="mt-5 text-article-body text-fg-soft md:text-article-body-lg">复现材料需要包含问题划分、证据快照、模型检查点、奖励定义和工具环境。若参考资料会更新，应保存实验时使用的版本；若工具存在随机性或资源限制，应记录这些条件。仅开放模型参数不足以重建完整推理实验，也无法解释不同团队在相同问题上得到不同结果的原因。</p><aside class="my-6 border-s-3 border-border-strong bg-surface-2 p-5"><h3 class="text-body-small font-semibold text-accent">研究局限｜不可验证问题与证据不足</h3><p class="mt-2 text-body-small text-fg-soft">开放科学问题可能缺少唯一答案或自动验证依据。此时修正后的语言表达更完整，并不等于结论更可靠。方法的适用范围应限定在证据和评价标准足够明确的任务上。</p></aside><p class="mt-5 text-article-body text-fg-soft md:text-article-body-lg">自演化推理的研究结论应建立在三个可检查条件上：验证反馈与独立评价具有明确关系，性能收益在预算一致条件下成立，错误修正能够迁移到未参与训练的问题。对于尚不满足这些条件的任务，应保留不确定性，避免以解释文本的长度或流畅度代替推理能力的证据。</p></div><p>完整交互版本需要启用 JavaScript。</p></noscript>
