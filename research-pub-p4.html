<noscript><h1>复旦未来技术研究院</h1><div class="article-body"><figure class="ambient-image__image block h-full w-full object-cover">具身策略的跨本体迁移同时受到<strong class="font-semibold text-fg">观测分布、动作空间与接触动力学</strong>的约束。仅统一数据文件格式，无法消除相机外参、控制频率与末端执行器结构造成的差异。开放创新平台的研究任务，是将这些差异显式记录为实验条件，并建立能够区分数据收益、模型收益与硬件适配收益的验证协议。<p class="mt-5 text-article-body text-fg-soft md:text-article-body-lg">本文以桌面操作为对象，讨论视觉条件策略、动作适配及 real-to-sim 参数辨识的联合设计。研究问题限定为：在训练数据规模和控制预算一致时，共享表征是否降低新本体的适配成本；加入接触反馈是否改善闭环恢复；真实轨迹校准是否减少仿真与真机之间的性能差异。以下描述方法与实验设计，不将预期收益视为已测得的结果。</p><h2 tabindex="-1" class="article-section-heading display mt-12 mb-4 text-subsection-title font-bold text-fg md:text-subsection-title-lg">1. 任务定义与可观测条件</h2><p class="mt-5 text-article-body text-fg-soft md:text-article-body-lg">机器人无法直接观测物体摩擦、接触状态和被遮挡几何，因此操作任务更适合表述为<em>部分可观测决策过程</em>。设历史窗口为 hₜ，任务目标为 g，本体描述为 e，策略输出下一段动作 aₜ。历史窗口应包含时间戳对齐的视觉、本体状态与接触信号；本体描述则用于标识动作维度、关节约束与末端结构。</p><figure class="my-6"><div class="article-equation flex items-center gap-4 border-y border-border py-5 text-body text-fg"><span class="min-w-0 flex-1"><span dir="ltr" class="article-math article-math--display" tabindex="0">a_t \sim \pi_\theta(\cdot \mid h_t,g,e), \qquad h_t=(o_{t-k+1},\ldots,o_t)</span></span><span class="mono shrink-0 text-metadata text-fg-muted">(1)</span></div><figcaption class="mt-3 text-metadata text-fg-muted"><span dir="ltr" class="article-math">\pi_\theta</span> 为条件策略；<span dir="ltr" class="article-math">k</span> 为观测历史长度。策略输出经过本体适配器与约束检查后执行。</figcaption></figure><p class="mt-5 text-article-body text-fg-soft md:text-article-body-lg">任务目标由可检验的终止条件定义。例如，放置任务要求物体位于目标区域且保持稳定，装配任务还需满足几何配合与接触约束。目标达成、超时、安全停止和人工接管分别记录，避免把不同结束原因合并为一个二元标签。终止判据在评估前冻结，不能在观察测试结果后修改。</p><ul class="article-list mt-4 space-y-3 ps-6 text-article-body text-fg-soft md:text-article-body-lg list-disc"><li><strong class="font-semibold text-fg">观测 oₜ：</strong> RGB / 深度图像、关节位置与速度、夹爪状态，以及可用的末端力或触觉信号。缺测通道需保留掩码。</li><li><strong class="font-semibold text-fg">动作 aₜ：</strong> 采用明确坐标系下的末端位姿增量与夹爪指令；需要同时保存单位、控制周期和执行延迟。</li><li><strong class="font-semibold text-fg">环境条件：</strong> 物体材质、质量范围、初始位姿、光照与相机标定版本，均作为轨迹元数据。</li><li><strong class="font-semibold text-fg">结束标记：</strong> 区分目标完成、执行超时、碰撞约束触发、传感异常与人工介入。</li></ul><figure class="article-figure my-8"><div class="article-figure__media relative overflow-hidden rounded-card bg-surface-2"><span class="ambient-image " style="--ambient-a:#bfc5c5;--ambient-b:#a9b0af" data-image-state="loading" data-image-immediate="true"><span class="ambient-image__light" aria-hidden="true"></span><span class="ambient-image__reveal"><img src="assets/content/src--content--mock--images--robot-arm.jpg" alt="图 1｜桌面操作场景配图。任务协议应明确观测通道、动作坐标系和终止条件；图片不表示实验结果。"  width="1400" height="927" loading="lazy" decoding="async" srcSet="assets/content/src--content--mock--images--thumbs--robot-arm.jpg 320w, assets/content/src--content--mock--images--robot-arm.jpg 1400w" sizes="(min-width: 768px) 680px, (min-width: 760px) 712px, calc(100vw - 48px)"/></figure></span></span></div><figcaption class="mt-3 text-metadata text-fg-muted">图 1｜桌面操作场景配图。任务协议应明确观测通道、动作坐标系和终止条件；图片不表示实验结果。</figcaption></figure><h2 tabindex="-1" class="article-section-heading display mt-12 mb-4 text-subsection-title font-bold text-fg md:text-subsection-title-lg">2. 数据划分与跨本体比较</h2><figure class="ambient-image__image block h-full w-full object-cover">连续视频帧具有高度相关性。若随机拆分帧，来自同一轨迹或同一场景布置的样本可能同时出现在训练集和测试集，导致对泛化能力的高估。数据划分应以采集会话、物体实例和场景配置为单位，并在采集阶段保存这些分组标识。测试集包含的实例不能通过后续数据补采回流到训练集。<div class="article-table-wrap my-8 overflow-x-auto" role="region" aria-label="表 1｜泛化验证的分层设计" tabindex="0"><p class="mb-2 text-metadata text-fg-muted sm:hidden">横向滑动查看完整表格</p><table class="article-table w-full text-start text-body-small text-fg-soft"><caption class="mb-3 text-start text-metadata text-fg-muted">表 1｜泛化验证的分层设计</caption><thead><tr><th scope="col">验证层级</th><th scope="col">保持一致的条件</th><th scope="col">独立变化的条件</th></tr></thead><tbody><tr><th scope="row">同分布复现</th><td>本体、物体集合、任务定义</td><td>随机种子与初始位姿</td></tr><tr><th scope="row">物体泛化</th><td>本体、控制器、任务类别</td><td>未见物体实例与材质</td></tr><tr><th scope="row">场景泛化</th><td>本体、动作接口、终止判据</td><td>背景、光照与相机视角</td></tr><tr><th scope="row">跨本体迁移</th><td>任务目标、数据预算、评价指标</td><td>机器人结构与适配数据</td></tr></tbody></table></div><p class="mt-5 text-article-body text-fg-soft md:text-article-body-lg">跨本体实验需要报告源域和目标域各自的数据量，而非仅给出合并后的总轨迹数。适配阶段使用的目标本体数据、梯度更新次数及人工调参成本也应单独列出。若共享模型使用更多数据、更多预训练或更长控制时间，其优势不能直接归因于跨本体表征。比较应在固定预算下进行，并补充随适配数据量变化的学习曲线。</p><p class="mt-5 text-article-body text-fg-soft md:text-article-body-lg"><a href="https://arxiv.org/abs/2310.08864" target="_blank" rel="noopener noreferrer" class="txt-hl text-accent underline underline-offset-3">Open X-Embodiment</a> 提供了跨机器人数据标准化与 RT-X 策略研究的公开范例。本文借鉴其跨平台研究问题，将数据接口与迁移评价分别处理；接口一致是实验可比较的前提，迁移收益仍需在目标本体上独立测量。</p><h2 tabindex="-1" class="article-section-heading display mt-12 mb-4 text-subsection-title font-bold text-fg md:text-subsection-title-lg">3. 策略学习与执行约束</h2><h3 tabindex="-1" class="article-section-heading display mt-8 mb-3 text-card-title-lg font-semibold text-fg">3.1 条件动作建模</h3><p class="mt-5 text-article-body text-fg-soft md:text-article-body-lg">行为克隆可作为基线：策略从示范轨迹学习观测到动作的条件分布。对于同一场景存在多种合法抓取方向的任务，单一均值回归可能把不同动作模式平均成无效轨迹。<a href="https://arxiv.org/abs/2303.04137" target="_blank" rel="noopener noreferrer" class="txt-hl text-accent underline underline-offset-3">Diffusion Policy</a> 将动作序列作为条件生成对象，并结合滚动时域执行，为多模态动作建模提供了可复现的参考路线。</p><figure class="my-6"><div class="article-equation flex items-center gap-4 border-y border-border py-5 text-body text-fg"><span class="min-w-0 flex-1"><span dir="ltr" class="article-math article-math--display" tabindex="0">L_{\mathrm{BC}}(\theta)=-\mathbb{E}_{(h,g,e,a)\sim D}\!\left[\log\pi_\theta(a\mid h,g,e)\right]</span></span><span class="mono shrink-0 text-metadata text-fg-muted">(2)</span></div><figcaption class="mt-3 text-metadata text-fg-muted">行为克隆的条件似然目标。不同本体的采样权重应明确，避免数据量最大的本体主导训练。</figcaption></figure><p class="mt-5 text-article-body text-fg-soft md:text-article-body-lg">动作预测长度与实际执行长度是两个不同参数。系统可以预测较长动作片段，但只执行其中的前缀，然后使用新观测重新规划。较长执行前缀降低推理开销，也会增加对环境变化的响应延迟；较短前缀则要求更高的推理频率。两者的取舍应通过执行延迟、任务成功率和动作平滑性共同评价。</p><h3 tabindex="-1" class="article-section-heading display mt-8 mb-3 text-card-title-lg font-semibold text-fg">3.2 本体适配与约束检查</h3><p class="mt-5 text-article-body text-fg-soft md:text-article-body-lg">本体适配器负责坐标变换、逆运动学和控制指令映射，不应隐含改变任务语义。策略输出进入执行器前，需要检查关节位置、速度及末端工作空间约束。被裁剪或拒绝的动作必须记录；如果某方法频繁触发约束，却仍依靠底层控制器完成任务，其结果应与无约束干预的执行分别报告。</p><aside class="my-6 border-s-3 border-border-strong bg-surface-2 p-5"><h3 class="text-body-small font-semibold text-accent">方法注释｜控制接口的可比较性</h3><p class="mt-2 text-body-small text-fg-soft">比较不同策略时固定低层控制器、约束检查和执行频率。若接口必须改变，将其作为独立实验因素，不能与策略结构的变化合并为同一个改进项。</p></aside><figure class="article-figure my-8"><div class="article-figure__media relative overflow-hidden rounded-card bg-surface-2"><span class="ambient-image " style="--ambient-a:#4f5054;--ambient-b:#504f54" data-image-state="loading" data-image-immediate="true"><span class="ambient-image__light" aria-hidden="true"></span><span class="ambient-image__reveal"><img src="assets/content/src--content--mock--images--robot3.jpg" alt="图 2｜多本体场景配图。跨本体评价需要分别统计数据预算、控制接口和硬件约束。"  width="1400" height="787" loading="lazy" decoding="async" srcSet="assets/content/src--content--mock--images--thumbs--robot3.jpg 320w, assets/content/src--content--mock--images--robot3.jpg 1400w" sizes="(min-width: 768px) 680px, (min-width: 760px) 712px, calc(100vw - 48px)"/></figure></span></span></div><figcaption class="mt-3 text-metadata text-fg-muted">图 2｜多本体场景配图。跨本体评价需要分别统计数据预算、控制接口和硬件约束。</figcaption></figure><h2 tabindex="-1" class="article-section-heading display mt-12 mb-4 text-subsection-title font-bold text-fg md:text-subsection-title-lg">4. Real-to-sim 参数辨识</h2><p class="mt-5 text-article-body text-fg-soft md:text-article-body-lg">真实与仿真差异可能来自接触摩擦、驱动响应、传感器噪声或通信延迟。参数辨识首先需要确定哪些参数能被现有观测约束：仅使用末端轨迹，往往无法区分摩擦误差与控制器误差；引入力和关节响应后，可以缩小等价参数集合。校准数据应包含不同接触状态，而非只包含已经成功完成的轨迹。</p><figure class="my-6"><div class="article-equation flex items-center gap-4 border-y border-border py-5 text-body text-fg"><span class="min-w-0 flex-1"><span dir="ltr" class="article-math article-math--display" tabindex="0">\phi^*=\operatorname*{arg\,min}_{\phi}\sum_j\sum_t\left\lVert y_{j,t}^{\mathrm{real}}-y_{j,t}^{\mathrm{sim}}(\phi)\right\rVert_W^2</span></span><span class="mono shrink-0 text-metadata text-fg-muted">(3)</span></div><figcaption class="mt-3 text-metadata text-fg-muted"><span dir="ltr" class="article-math">\phi</span> 表示待辨识的仿真参数；<span dir="ltr" class="article-math">y</span> 为选定观测；<span dir="ltr" class="article-math">W</span> 为按量纲与测量噪声确定的权重矩阵。</figcaption></figure><p class="mt-5 text-article-body text-fg-soft md:text-article-body-lg">损失项不能直接混合以米、弧度和牛顿表示的残差。应先根据传感器噪声或任务容差进行尺度化，再确定权重。用于辨识的轨迹与用于检验的轨迹相互独立：前者拟合参数，后者评价仿真对未见接触过程的解释能力。若同一批轨迹既参与参数拟合又参与误差报告，结论只能说明拟合程度。</p><ol class="article-list mt-4 space-y-3 ps-6 text-article-body text-fg-soft md:text-article-body-lg list-decimal"><li>完成相机、关节和力传感器的时间对齐，记录时钟偏差与控制延迟。</li><li>以独立校准轨迹辨识动力学与接触参数，报告参数范围及残差分布。</li><li>在冻结参数后进行仿真策略训练，保留场景配置和随机化分布。</li><li>以未参与辨识的真实任务验证迁移，分析失败类型与仿真误差的对应关系。</li></ol><p class="mt-5 text-article-body text-fg-soft md:text-article-body-lg">域随机化用于覆盖参数不确定性，其采样范围应由观测误差和辨识残差约束。任意扩大范围可能使训练任务偏离真实分布，任意缩小范围则容易过拟合单一设备。评价时应分别比较未校准仿真、校准仿真与校准后随机化，识别每一环节带来的贡献。</p><h2 tabindex="-1" class="article-section-heading display mt-12 mb-4 text-subsection-title font-bold text-fg md:text-subsection-title-lg">5. 评价指标与统计单位</h2><p class="mt-5 text-article-body text-fg-soft md:text-article-body-lg">实验的基本统计单位是完整回合，而不是视频帧或控制步。成功率按预注册终止条件计算，人工介入率与安全停止率分别统计。对长程任务还需报告子目标完成率，以区分早期感知失败与后期误差累积。平均执行时间应与超时比例一起解释，避免只在成功回合上统计耗时造成选择偏差。</p><div class="article-table-wrap my-8 overflow-x-auto" role="region" aria-label="表 2｜建议报告的指标及其解释边界" tabindex="0"><p class="mb-2 text-metadata text-fg-muted sm:hidden">横向滑动查看完整表格</p><table class="article-table w-full text-start text-body-small text-fg-soft"><caption class="mb-3 text-start text-metadata text-fg-muted">表 2｜建议报告的指标及其解释边界</caption><thead><tr><th scope="col">指标</th><th scope="col">计算口径</th><th scope="col">主要回答的问题</th></tr></thead><tbody><tr><th scope="row">任务成功率</th><td>成功回合数 / 总回合数</td><td>在冻结判据下完成任务的频率</td></tr><tr><th scope="row">人工介入率</th><td>发生接管的回合数 / 总回合数</td><td>系统对外部辅助的依赖</td></tr><tr><th scope="row">恢复成功率</th><td>恢复后完成数 / 可恢复失败数</td><td>失败后的继续执行能力</td></tr><tr><th scope="row">执行开销</th><td>控制步数、耗时与推理延迟</td><td>性能是否依赖更高资源预算</td></tr><tr><th scope="row">约束触发率</th><td>动作被拒绝或停止的频率</td><td>策略与本体约束的兼容程度</td></tr></tbody></table></div><p class="mt-5 text-article-body text-fg-soft md:text-article-body-lg">每种条件使用多个独立训练种子，并在相同初始配置下进行配对比较。置信区间按任务或采集会话分组重采样，不能把同一物体的重复尝试当作完全独立样本。对于样本较少的罕见失败，应同时给出原始计数；只有百分比而没有分母，无法判断结果是否稳定。</p><h2 tabindex="-1" class="article-section-heading display mt-12 mb-4 text-subsection-title font-bold text-fg md:text-subsection-title-lg">6. 消融实验与失效分析</h2><p class="mt-5 text-article-body text-fg-soft md:text-article-body-lg">消融实验应一次改变一个关键因素，并保持其他预算一致。共享视觉编码器、接触输入与仿真校准可能存在交互效应，因此除单因素消融外，还应检查组合条件。若接触反馈只在校准仿真后有效，这说明两个因素共同作用，不能把全部收益分别计入每一模块。</p><ul class="article-list mt-4 space-y-3 ps-6 text-article-body text-fg-soft md:text-article-body-lg list-disc"><li><strong class="font-semibold text-fg">去除历史窗口：</strong> 检验短时序信息对遮挡判断、滑移识别和动作恢复的贡献。</li><li><strong class="font-semibold text-fg">去除接触信号：</strong> 在视觉数据一致时比较接触任务，排除额外示范数据造成的差异。</li><li><strong class="font-semibold text-fg">独立训练与共享训练：</strong> 固定目标本体的数据预算，比较迁移收益及负迁移。</li><li><strong class="font-semibold text-fg">改变执行前缀：</strong> 比较推理延迟、响应速度和长程误差累积。</li></ul><p class="mt-5 text-article-body text-fg-soft md:text-article-body-lg">失效标签至少区分目标定位错误、不可达动作、接触失稳和终止判断错误。为每类失败保留首次异常时间、相关观测和后续控制响应，才有可能建立模块层面的解释。仅用任务成功率排序，无法判断一个方法的改进是否解决了主要瓶颈，或者只是改变了失败发生的阶段。</p><h2 tabindex="-1" class="article-section-heading display mt-12 mb-4 text-subsection-title font-bold text-fg md:text-subsection-title-lg">7. 复现材料与适用范围</h2><p class="mt-5 text-article-body text-fg-soft md:text-article-body-lg">复现包应包含数据划分清单、观测与动作模式、软件环境、模型检查点和评价脚本。轨迹记录使用稳定标识，如 <code class="article-inline-code">episode_id</code>、<code class="article-inline-code">robot_id</code>、<code class="article-inline-code">calibration_version</code> 和 <code class="article-inline-code">termination_reason</code>；版本变化必须保留映射，避免数据更新后无法重建论文中的训练与测试集合。</p><aside class="my-6 border-s-3 border-border-strong bg-surface-2 p-5"><h3 class="text-body-small font-semibold text-accent">研究局限｜分布外接触与未覆盖本体</h3><p class="mt-2 text-body-small text-fg-soft">桌面刚体操作得到的结论不能直接外推到柔性物体、移动操作或人机接触场景。新本体的关节结构、传感器配置和控制延迟改变后，应重新检验接口与迁移性能。</p></aside><p class="mt-5 text-article-body text-fg-soft md:text-article-body-lg">该方法框架的价值取决于是否建立可检验的比较条件。平台后续实验应优先公开数据预算、独立测试划分、原始回合计数与失败分类，再讨论性能变化的机制。只有这些条件齐备，跨本体训练与 real-to-sim 校准的贡献才可以被独立评价。</p></div><p>完整交互版本需要启用 JavaScript。</p></noscript>
